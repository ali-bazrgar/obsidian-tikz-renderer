name: Temporary build diagnostics
on:
  push:
    paths:
      - '.github/workflows/_debug-build.yml'
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck
      - name: Capture production build output
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          status=$?
          cat build.log
          echo "$status" > build.status
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build.log
            build.status
