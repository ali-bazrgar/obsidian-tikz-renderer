name: apply-wheel-interaction-fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch renderer wheel interaction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/ui/renderer-view.ts')
          s = p.read_text(encoding='utf-8')
          pattern = r'    const wheel = \(e: WheelEvent\): void => \{.*?\n    win\?\.addEventListener\("wheel", wheel, \{ passive: false, capture: true \}\);'
          replacement = r'''    const wheel = (e: WheelEvent): void => {
      const reading = isReadingMode();
      if (!shell.isConnected) return;
      const target = e.target;
      if (!(target instanceof Node) || !viewport.contains(target)) return;
      if (target instanceof HTMLInputElement || target instanceof HTMLButtonElement) return;
      if (!ensureIntrinsicSize()) return;

      e.preventDefault();
      e.stopPropagation();

      // Mouse wheel: zoom. Ctrl+wheel: viewport height.
      // Read never persists these temporary changes; leaving Read restores
      // the exact Edit geometry stored in viewStates.
      if (e.ctrlKey) {
        const heightStep = Math.max(8, Math.min(80, Math.abs(e.deltaY) * 0.75));
        viewportHeight = clampViewportHeight(viewportHeight + (e.deltaY < 0 ? heightStep : -heightStep));
        applyZoom();
        if (!reading) persistEditViewState();
        return;
      }

      const old = zoom;
      const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
      const next = clampZoom(old * factor);
      const r = viewport.getBoundingClientRect();
      const x = e.clientX - r.left;
      const y = e.clientY - r.top;
      const ratio = next / old;
      if (next !== old) {
        panX = x - (x - panX) * ratio;
        panY = y - (y - panY) * ratio;
        zoom = next;
        clampCurrentPan();
      }
      if (!reading) persistEditViewState();
      applyZoom();
    };
    win?.addEventListener("wheel", wheel, { passive: false, capture: true });'''
          ns, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Expected wheel handler was not found; refusing to modify the file.')
          p.write_text(ns, encoding='utf-8')
          PY
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-wheel-interaction-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ui/renderer-view.ts .github/workflows/apply-wheel-interaction-fix.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat: make mouse wheel zoom and ctrl-wheel resize viewport'
          git push
